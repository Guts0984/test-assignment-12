# Abuse check (infra/attack/run.sh): attacker and legit client run on their OWN network with fixed addresses,
# and nginx is attached to it as well. The default compose network keeps Docker's automatic subnet, so a
# second copy of the project can run next to this one.
#   docker compose -f docker-compose.yml -f docker-compose.attack.yml --profile attack ...
# The API only ever sees nginx (on the default network, inside TRUST_PROXY_CIDRS); nginx reports the real
# peer address (172.31.77.50 / .51) in X-Forwarded-For. Another prefix: ATTACK_NET_PREFIX=172.30.99
x-attack-env: &attack-env
  TARGET: "http://nginx"
  DURATION_S: "${ATTACK_SECONDS:-20}"
  ATTACKER_IP: "${ATTACK_NET_PREFIX:-172.31.77}.50"
  VICTIM_IP: "${ATTACK_NET_PREFIX:-172.31.77}.51"
services:
  nginx:
    networks: [default, attack]
  attacker:
    profiles: [attack]
    image: node:24-slim
    volumes: ["./infra/attack:/attack:ro"]
    command: ["node", "/attack/run.mjs", "attacker"]
    environment: *attack-env
    networks: { attack: { ipv4_address: "${ATTACK_NET_PREFIX:-172.31.77}.50" } }
    depends_on: [nginx]
  legit:
    profiles: [attack]
    image: node:24-slim
    volumes: ["./infra/attack:/attack:ro"]
    command: ["node", "/attack/run.mjs", "legit"]
    environment: *attack-env
    networks: { attack: { ipv4_address: "${ATTACK_NET_PREFIX:-172.31.77}.51" } }
    depends_on: [nginx]
networks:
  attack:
    ipam:
      config: [{ subnet: "${ATTACK_NET_PREFIX:-172.31.77}.0/24" }]
