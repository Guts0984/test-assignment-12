worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;

  # Edge limits, per client address. The API applies its own (Redis-backed) limits behind this;
  # nginx makes sure a flood never even reaches Node.
  limit_req_zone  $binary_remote_addr zone=perip:10m   rate=5000r/s;
  limit_conn_zone $binary_remote_addr zone=connperip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream web { server web:3000; keepalive 16; }
  upstream api { server api:4000; keepalive 32; }

  # slow-client defences
  client_header_timeout 10s;
  client_body_timeout   10s;
  send_timeout          15s;
  keepalive_timeout     15s;
  client_max_body_size  100k;
  large_client_header_buffers 4 8k;

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # GraphQL over HTTP and WebSocket (graphql-ws) on one path.
    location /graphql {
      limit_req  zone=perip burst=5000 nodelay;
      limit_conn connperip 2000;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # REPLACE (not append to) whatever the client sent: the API trusts only what nginx says
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      limit_req  zone=perip burst=5000 nodelay;
      limit_conn connperip 2000;
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
    }
  }
}
