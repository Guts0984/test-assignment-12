# Infra for local dev; later blocks add db-init, api, worker, web, nginx to this file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-init:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_PASSWORD: ${SEED_PASSWORD}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_RNG: ${SEED_RNG:-12345}
      SEED_DOCTORS: ${SEED_DOCTORS:-40}
      SEED_PATIENTS: ${SEED_PATIENTS:-20000}
      SEED_APPOINTMENTS: ${SEED_APPOINTMENTS:-150000}
      SEED_PAST_DAYS: ${SEED_PAST_DAYS:-150}
      SEED_FUTURE_DAYS: ${SEED_FUTURE_DAYS:-30}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["${MAILPIT_UI_PORT:-8025}:8025", "${SMTP_PORT:-1025}:1025"]

volumes:
  pgdata:
