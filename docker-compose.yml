# Infra for local dev; later blocks add db-init, api, worker, web, nginx to this file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-init:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_PASSWORD: ${SEED_PASSWORD}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_RNG: ${SEED_RNG:-12345}
      SEED_DOCTORS: ${SEED_DOCTORS:-40}
      SEED_PATIENTS: ${SEED_PATIENTS:-20000}
      SEED_APPOINTMENTS: ${SEED_APPOINTMENTS:-150000}
      SEED_PAST_DAYS: ${SEED_PAST_DAYS:-150}
      SEED_FUTURE_DAYS: ${SEED_FUTURE_DAYS:-30}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS}
      GQL_MAX_DEPTH: ${GQL_MAX_DEPTH:-10}
      GQL_MAX_COMPLEXITY: ${GQL_MAX_COMPLEXITY:-2000}
      GQL_MAX_FIELDS: ${GQL_MAX_FIELDS:-400}
      BODY_LIMIT_KB: ${BODY_LIMIT_KB:-100}
      RATE_GLOBAL_PER_MIN: ${RATE_GLOBAL_PER_MIN:-300}
      RATE_SIGNIN_PER_MIN: ${RATE_SIGNIN_PER_MIN:-5}
      RATE_SIGNIN_IP_PER_MIN: ${RATE_SIGNIN_IP_PER_MIN:-20}
      RATE_SIGNUP_PER_HOUR: ${RATE_SIGNUP_PER_HOUR:-5}
      RATE_HOLD_PER_MIN: ${RATE_HOLD_PER_MIN:-10}
      WS_MAX_CONN_PER_IP: ${WS_MAX_CONN_PER_IP:-10}
      WS_MAX_SUBS_PER_CONN: ${WS_MAX_SUBS_PER_CONN:-10}
      ARGON_MEMORY_KIB: ${ARGON_MEMORY_KIB:-19456}
      ARGON_TIME_COST: ${ARGON_TIME_COST:-2}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
      OFFER_TTL_SECONDS: ${OFFER_TTL_SECONDS:-900}
      MIN_LEAD_MINUTES: ${MIN_LEAD_MINUTES:-120}
      MAX_ADVANCE_DAYS: ${MAX_ADVANCE_DAYS:-60}
      PREP_MINUTES: ${PREP_MINUTES:-5}
    ports: ["${API_PORT:-4000}:4000"]
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM}
      QUEUE_NAME: ${QUEUE_NAME:-clinic-tasks}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_RECONCILE_MS: ${WORKER_RECONCILE_MS:-15000}
      WORKER_HORIZON_SECONDS: ${WORKER_HORIZON_SECONDS:-3600}
      WORKER_STALLED_INTERVAL_MS: ${WORKER_STALLED_INTERVAL_MS:-30000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-8}
      WORKER_RETRY_BASE_MS: ${WORKER_RETRY_BASE_MS:-1000}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
      OFFER_TTL_SECONDS: ${OFFER_TTL_SECONDS:-900}
      MIN_LEAD_MINUTES: ${MIN_LEAD_MINUTES:-120}
      MAX_ADVANCE_DAYS: ${MAX_ADVANCE_DAYS:-60}
      PREP_MINUTES: ${PREP_MINUTES:-5}
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    restart: unless-stopped
    # run several copies:  docker compose up --scale worker=3

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports: ["${MAILPIT_UI_PORT:-8025}:8025", "${SMTP_PORT:-1025}:1025"]

volumes:
  pgdata:
