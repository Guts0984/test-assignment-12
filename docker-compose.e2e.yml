# Overrides for end-to-end runs: short hold/offer lifetimes, relaxed limits, small seed.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
services:
  db-init:
    environment:
      SEED_PATIENTS: 400
      SEED_APPOINTMENTS: 3000
      SEED_DOCTORS: 30
      SEED_WAITLIST_ENTRIES: 0
  api:
    ports: ["127.0.0.1:${API_PORT:-54000}:4000"]   # tests also talk to the API directly
    environment:
      HOLD_TTL_SECONDS: 8
      OFFER_TTL_SECONDS: 8
      RATE_GLOBAL_PER_MIN: 100000
      RATE_SIGNIN_PER_MIN: 1000
      RATE_SIGNIN_IP_PER_MIN: 1000
      RATE_SIGNUP_PER_HOUR: 1000
      RATE_HOLD_PER_MIN: 1000
      RATE_WS_CONNECT_PER_MIN: 100000
      RATE_WS_SUBSCRIBE_PER_MIN: 100000
      RATE_COST_PER_MIN: 100000000
      WS_MAX_CONN_PER_IP: 1000
      WS_MAX_SUBS_PER_CONN: 100
      ARGON_MEMORY_KIB: 4096
      ARGON_TIME_COST: 1
      CORS_ORIGINS: http://localhost:3190,http://localhost:${HTTP_PORT:-8080}
      TRUST_PROXY_CIDRS: 172.16.0.0/12
  worker:
    environment:
      HOLD_TTL_SECONDS: 8
      OFFER_TTL_SECONDS: 8
      WORKER_RECONCILE_MS: 1000
  nginx:
    # same routing, edge limits lifted: all browsers of the suite share one source address
    volumes: ["./infra/nginx/nginx.e2e.conf:/etc/nginx/nginx.conf:ro"]
